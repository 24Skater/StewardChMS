services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: stewardchms-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-steward}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-steward123}
      POSTGRES_DB: ${POSTGRES_DB:-stewardchms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-steward} -d ${POSTGRES_DB:-stewardchms}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: stewardchms-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-steward}:${POSTGRES_PASSWORD:-steward123}@db:5432/${POSTGRES_DB:-stewardchms}
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production-please}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@stewardchms.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_NAME: ${ADMIN_NAME:-System Administrator}
      # Steward platform. Unset on a self-hosted install, and that is the
      # supported default: with no root domain this app resolves its single
      # organization and behaves exactly as it always has. Set both to have the
      # console provision churches into this deployment -- without them the
      # provisioning endpoint refuses every call, so a Congregation deployed
      # with this file could not be provisioned at all.
      PLATFORM_ROOT_DOMAIN: ${PLATFORM_ROOT_DOMAIN:-}
      PLATFORM_SERVICE_TOKEN: ${PLATFORM_SERVICE_TOKEN:-}
      # Single sign-on. Unset is the supported default: the SSO routes answer
      # 404 and the password form is the only way in, exactly as before. The
      # same omission that made a Docker-deployed Congregation unprovisionable
      # would otherwise make one unable to offer SSO no matter what the
      # environment file said.
      AUTH0_ISSUER: ${AUTH0_ISSUER:-}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET:-}
      AUTH0_BUTTON_LABEL: ${AUTH0_BUTTON_LABEL:-}
      ALLOW_LOCAL_PASSWORD_LOGIN: ${ALLOW_LOCAL_PASSWORD_LOGIN:-}
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  # Frontend (Nginx + React SPA)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: stewardchms-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  # Database migrations runner (one-time job)
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile.migrate
    container_name: stewardchms-migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-steward}:${POSTGRES_PASSWORD:-steward123}@db:5432/${POSTGRES_DB:-stewardchms}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@stewardchms.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      ADMIN_NAME: ${ADMIN_NAME:-System Administrator}
    command: >
      sh -c "npx prisma migrate deploy && npm run db:seed"
    restart: "no"

volumes:
  postgres_data:

networks:
  default:
    name: stewardchms-network

