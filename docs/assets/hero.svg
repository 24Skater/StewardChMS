<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="45%" stop-color="#0f1f3d"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="shieldGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1b2a41" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0"/>
      <stop offset="30%" stop-color="#1e293b" stop-opacity="1"/>
      <stop offset="70%" stop-color="#1e293b" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1e293b" stroke-width="0.6"/>
    </pattern>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#1e293b" opacity="0.8"/>
    </pattern>
    <clipPath id="bannerClip">
      <rect width="1200" height="380" rx="0"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" fill="url(#bgGrad)"/>
  <rect width="1200" height="380" fill="url(#dots)" opacity="0.6"/>

  <!-- Decorative horizontal lines -->
  <line x1="0" y1="1" x2="1200" y2="1" stroke="url(#lineGrad)" stroke-width="0.5"/>
  <line x1="0" y1="379" x2="1200" y2="379" stroke="url(#lineGrad)" stroke-width="0.5"/>

  <!-- Right side decorative arc rings -->
  <circle cx="980" cy="190" r="240" fill="none" stroke="#1e3a5f" stroke-width="1" opacity="0.5"/>
  <circle cx="980" cy="190" r="180" fill="none" stroke="#1e3a5f" stroke-width="1" opacity="0.4"/>
  <circle cx="980" cy="190" r="120" fill="none" stroke="#2563eb" stroke-width="0.8" opacity="0.25"/>
  <circle cx="980" cy="190" r="60" fill="none" stroke="#2563eb" stroke-width="1" opacity="0.2"/>

  <!-- Shield glow aura -->
  <ellipse cx="190" cy="200" rx="100" ry="130" fill="url(#shieldGlow)" opacity="0.6"/>

  <!-- Large shield mark (centered left) -->
  <g transform="translate(95, 42) scale(2.95)" filter="url(#softGlow)">
    <path d="M32 4L8 16v16c0 14.4 10.24 27.84 24 32 13.76-4.16 24-17.6 24-32V16L32 4z" fill="#1B2A41"/>
    <path d="M32 4L8 16v16c0 14.4 10.24 27.84 24 32 13.76-4.16 24-17.6 24-32V16L32 4z" fill="none" stroke="#3b82f6" stroke-width="0.8" opacity="0.7"/>
    <path d="M32 14c-6.627 0-12 4.477-12 10 0 3.314 2.015 6.236 5.143 8L32 36l6.857-4c3.128-1.764 5.143-4.686 5.143-8 0-5.523-5.373-10-12-10z" fill="#2563EB"/>
    <path d="M32 50c6.627 0 12-4.477 12-10 0-3.314-2.015-6.236-5.143-8L32 28l-6.857 4c-3.128 1.764-5.143 4.686-5.143 8 0 5.523 5.373 10 12 10z" fill="#2563EB"/>
  </g>

  <!-- Vertical separator line -->
  <line x1="360" y1="60" x2="360" y2="320" stroke="#1e3a5f" stroke-width="1" opacity="0.8"/>

  <!-- STEWARD wordmark -->
  <text x="400" y="155" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="90" font-weight="800" fill="#f8fafc" letter-spacing="-3" opacity="0.97">STEWARD</text>

  <!-- Dot separator -->
  <circle cx="403" cy="184" r="4" fill="#2563eb"/>
  <circle cx="416" cy="184" r="4" fill="#2563eb"/>
  <circle cx="429" cy="184" r="4" fill="#2563eb"/>

  <!-- Subtitle -->
  <text x="400" y="220" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="400" fill="#94a3b8" letter-spacing="6">CHURCH MANAGEMENT SYSTEM</text>

  <!-- Tagline -->
  <text x="400" y="258" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="300" fill="#64748b" letter-spacing="0.5">Open source · TypeScript · React · PostgreSQL</text>

  <!-- Feature chips row 1 -->
  <!-- People & Families -->
  <rect x="400" y="282" width="130" height="28" rx="14" fill="#1e3a5f" stroke="#2563eb" stroke-width="1" opacity="0.9"/>
  <text x="465" y="300" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#93c5fd">👥 People &amp; Families</text>

  <!-- Events -->
  <rect x="542" y="282" width="100" height="28" rx="14" fill="#1c1917" stroke="#f59e0b" stroke-width="1" opacity="0.9"/>
  <text x="592" y="300" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#fcd34d">📅 Events</text>

  <!-- Giving -->
  <rect x="654" y="282" width="90" height="28" rx="14" fill="#14532d" stroke="#16a34a" stroke-width="1" opacity="0.9"/>
  <text x="699" y="300" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#86efac">💰 Giving</text>

  <!-- Worship -->
  <rect x="756" y="282" width="100" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" opacity="0.9"/>
  <text x="806" y="300" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#a5b4fc">🎵 Worship</text>

  <!-- Feature chips row 2 -->
  <!-- Check-In -->
  <rect x="400" y="320" width="120" height="28" rx="14" fill="#1a1a2e" stroke="#8b5cf6" stroke-width="1" opacity="0.9"/>
  <text x="460" y="338" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#c4b5fd">🔐 Kids Check-In</text>

  <!-- Communications -->
  <rect x="532" y="320" width="135" height="28" rx="14" fill="#1c1917" stroke="#ea580c" stroke-width="1" opacity="0.9"/>
  <text x="599" y="338" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#fdba74">📣 Communications</text>

  <!-- Reports -->
  <rect x="679" y="320" width="96" height="28" rx="14" fill="#1e293b" stroke="#0ea5e9" stroke-width="1" opacity="0.9"/>
  <text x="727" y="338" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#7dd3fc">📊 Reports</text>

  <!-- Schedules chip -->
  <rect x="787" y="320" width="115" height="28" rx="14" fill="#171717" stroke="#d97706" stroke-width="1" opacity="0.9"/>
  <text x="844" y="338" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="500" fill="#fbbf24">🗓 Scheduling</text>

  <!-- Right side: mini module grid visual -->
  <g transform="translate(940, 70)" opacity="0.85">
    <!-- Card backgrounds -->
    <rect x="0" y="0" width="100" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="110" y="0" width="100" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="55" y="80" width="100" height="70" rx="8" fill="#1e293b" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="0" y="160" width="100" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <rect x="110" y="160" width="100" height="70" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>

    <!-- Card 1: Members -->
    <circle cx="50" cy="28" r="14" fill="#1e3a5f"/>
    <text x="50" y="33" text-anchor="middle" font-size="16">👥</text>
    <text x="50" y="55" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#93c5fd">Members</text>
    <text x="50" y="65" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#475569">CRM + Households</text>

    <!-- Card 2: Giving -->
    <circle cx="160" cy="28" r="14" fill="#14532d"/>
    <text x="160" y="33" text-anchor="middle" font-size="16">💰</text>
    <text x="160" y="55" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#86efac">Giving</text>
    <text x="160" y="65" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#475569">Stripe + Pledges</text>

    <!-- Card 3: Events (highlighted center) -->
    <circle cx="105" cy="108" r="14" fill="#1e1b4b"/>
    <text x="105" y="113" text-anchor="middle" font-size="16">📅</text>
    <text x="105" y="135" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#a5b4fc">Events</text>
    <text x="105" y="145" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#475569">Check-In + Kiosk</text>

    <!-- Card 4: Reports -->
    <circle cx="50" cy="188" r="14" fill="#1c1917"/>
    <text x="50" y="193" text-anchor="middle" font-size="16">📊</text>
    <text x="50" y="215" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#fcd34d">Reports</text>
    <text x="50" y="225" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#475569">PDF + CSV</text>

    <!-- Card 5: Worship -->
    <circle cx="160" cy="188" r="14" fill="#1a1a2e"/>
    <text x="160" y="193" text-anchor="middle" font-size="16">🎵</text>
    <text x="160" y="215" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#c4b5fd">Worship</text>
    <text x="160" y="225" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#475569">Songs + Plans</text>

    <!-- Connecting lines between cards -->
    <line x1="100" y1="70" x2="105" y2="80" stroke="#334155" stroke-width="0.8" stroke-dasharray="2,2"/>
    <line x1="160" y1="70" x2="120" y2="80" stroke="#334155" stroke-width="0.8" stroke-dasharray="2,2"/>
    <line x1="65" y1="150" x2="55" y2="160" stroke="#334155" stroke-width="0.8" stroke-dasharray="2,2"/>
    <line x1="145" y1="150" x2="165" y2="160" stroke="#334155" stroke-width="0.8" stroke-dasharray="2,2"/>
  </g>

  <!-- Bottom border accent -->
  <rect x="0" y="374" width="1200" height="6" fill="#2563eb" opacity="0.8"/>
  <rect x="0" y="374" width="300" height="6" fill="url(#bgGrad)" opacity="0.5"/>
  <rect x="900" y="374" width="300" height="6" fill="url(#bgGrad)" opacity="0.5"/>
</svg>
