<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 160" fill="none">
  <rect width="900" height="160" fill="#0f172a" rx="12"/>
  <rect x="1" y="1" width="898" height="158" rx="11" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Section label -->
  <text x="450" y="26" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#475569" letter-spacing="3">TECHNOLOGY STACK</text>
  <line x1="60" y1="36" x2="390" y2="36" stroke="#1e293b" stroke-width="1"/>
  <line x1="510" y1="36" x2="840" y2="36" stroke="#1e293b" stroke-width="1"/>

  <!-- TypeScript -->
  <g transform="translate(60, 52)">
    <rect width="110" height="90" rx="8" fill="#1e293b" stroke="#3178c6" stroke-width="1.5"/>
    <rect x="0" y="0" width="110" height="4" rx="2" fill="#3178c6"/>
    <text x="55" y="38" text-anchor="middle" font-family="monospace" font-size="28" font-weight="800" fill="#3178c6">TS</text>
    <text x="55" y="62" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">TypeScript</text>
    <text x="55" y="76" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#64748b">5.6 — Full stack</text>
  </g>

  <!-- React -->
  <g transform="translate(185, 52)">
    <rect width="110" height="90" rx="8" fill="#1e293b" stroke="#61dafb" stroke-width="1.5"/>
    <rect x="0" y="0" width="110" height="4" rx="2" fill="#61dafb"/>
    <!-- React atom -->
    <ellipse cx="55" cy="32" rx="22" ry="9" fill="none" stroke="#61dafb" stroke-width="2"/>
    <ellipse cx="55" cy="32" rx="22" ry="9" fill="none" stroke="#61dafb" stroke-width="2" transform="rotate(60, 55, 32)"/>
    <ellipse cx="55" cy="32" rx="22" ry="9" fill="none" stroke="#61dafb" stroke-width="2" transform="rotate(120, 55, 32)"/>
    <circle cx="55" cy="32" r="4" fill="#61dafb"/>
    <text x="55" y="62" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">React 18</text>
    <text x="55" y="76" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#64748b">Vite + TanStack</text>
  </g>

  <!-- PostgreSQL -->
  <g transform="translate(310, 52)">
    <rect width="110" height="90" rx="8" fill="#1e293b" stroke="#336791" stroke-width="1.5"/>
    <rect x="0" y="0" width="110" height="4" rx="2" fill="#336791"/>
    <!-- PG elephant simplified -->
    <ellipse cx="55" cy="30" rx="18" ry="14" fill="#336791" opacity="0.8"/>
    <circle cx="55" cy="28" r="10" fill="#1e293b"/>
    <text x="55" y="33" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#336791">PG</text>
    <text x="55" y="62" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">PostgreSQL</text>
    <text x="55" y="76" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#64748b">16 + Prisma ORM</text>
  </g>

  <!-- Express -->
  <g transform="translate(435, 52)">
    <rect width="110" height="90" rx="8" fill="#1e293b" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2"/>
    <rect x="0" y="0" width="110" height="4" rx="2" fill="#94a3b8"/>
    <text x="55" y="38" text-anchor="middle" font-family="monospace" font-size="22" font-weight="300" fill="#e2e8f0">ex</text>
    <text x="55" y="62" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Express</text>
    <text x="55" y="76" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#64748b">4.21 REST API</text>
  </g>

  <!-- Tailwind -->
  <g transform="translate(560, 52)">
    <rect width="110" height="90" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
    <rect x="0" y="0" width="110" height="4" rx="2" fill="#06b6d4"/>
    <!-- Tailwind wave simplified -->
    <path d="M 27 32 Q 36 22 46 32 Q 55 42 65 32 Q 74 22 83 32" stroke="#06b6d4" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="55" y="62" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Tailwind CSS</text>
    <text x="55" y="76" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#64748b">+ shadcn/ui</text>
  </g>

  <!-- Stripe -->
  <g transform="translate(685, 52)">
    <rect width="110" height="90" rx="8" fill="#1e293b" stroke="#635bff" stroke-width="1.5"/>
    <rect x="0" y="0" width="110" height="4" rx="2" fill="#635bff"/>
    <text x="55" y="38" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#635bff">S</text>
    <text x="55" y="62" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Stripe</text>
    <text x="55" y="76" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#64748b">Payments + Giving</text>
  </g>

  <!-- Vitest -->
  <g transform="translate(810, 52)">
    <rect width="80" height="90" rx="8" fill="#1e293b" stroke="#6e9f18" stroke-width="1.5"/>
    <rect x="0" y="0" width="80" height="4" rx="2" fill="#6e9f18"/>
    <!-- Vitest V logo simplified -->
    <path d="M 28 20 L 40 42 L 52 20" stroke="#6e9f18" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <text x="40" y="62" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#f8fafc">Vitest</text>
    <text x="40" y="76" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#64748b">+ Supertest</text>
  </g>
</svg>
