<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 82" fill="none">
  <title>Steward Horizontal Lockup</title>

  <!-- Cross Key Mark -->
  <rect x="28" y="2" width="8" height="32" rx="4" fill="#E8B847"/>
  <rect x="12" y="14" width="40" height="8" rx="4" fill="#E8B847"/>
  <rect x="30" y="32" width="4" height="40" rx="2" fill="#E8B847"/>
  <rect x="34" y="53" width="13" height="5" rx="2.5" fill="#E8B847"/>
  <rect x="34" y="64" width="9" height="5" rx="2.5" fill="#E8B847"/>

  <!-- Divider -->
  <line x1="84" y1="10" x2="84" y2="72" stroke="#E8B847" stroke-width="1" opacity="0.35"/>

  <!-- Wordmark: STEWARD -->
  <text
    x="104"
    y="50"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="38"
    font-weight="300"
    letter-spacing="12"
    fill="#E8B847"
  >STEWARD</text>

  <!-- Rule beneath wordmark -->
  <line x1="104" y1="59" x2="396" y2="59" stroke="#E8B847" stroke-width="0.8" opacity="0.35"/>

  <!-- Subline -->
  <text
    x="104"
    y="72"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="9"
    font-weight="400"
    letter-spacing="5"
    fill="#E8B847"
    opacity="0.48"
  >CHURCH MANAGEMENT SYSTEM</text>
</svg>
